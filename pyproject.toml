[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novapolis"
version = "1.0.0"
description = "Novapolis Résilience — planification des secours et réseau de fibre (projet EFREI, théorie des graphes)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "networkx>=3", "matplotlib>=3.8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
novapolis = "novapolis.cli:main"

[tool.setuptools.packages.find]
include = ["novapolis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E741"]
